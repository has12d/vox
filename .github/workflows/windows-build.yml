name: windows-build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout vox (sparse, skip pixel_tests)
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/has12d/vox.git vox
          cd vox
          git sparse-checkout init --no-cone
          git sparse-checkout set '/*' '!/pixel_tests/'
          git checkout master

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-7zip
            mingw-w64-x86_64-curl
            git

      - name: Build pinned V
        shell: msys2 {0}
        run: |
          git init v-pin
          git -C v-pin remote add origin https://github.com/vlang/v.git
          git -C v-pin fetch --depth 1 origin eeee53a268261d8cd15a831b55704628ba710def
          git -C v-pin checkout FETCH_HEAD
          cd v-pin
          ./makev.bat build -gcc

      - name: Install UI2
        shell: msys2 {0}
        run: ./v-pin/v.exe install ui2

      - name: Provide JavaScriptCore.dll
        shell: msys2 {0}
        run: npx -y playwright install webkit

      - name: Build Vox.exe
        shell: msys2 {0}
        working-directory: vox
        run: |
          export PATH="$PWD/../v-pin:/mingw64/bin:/usr/bin:$PATH"
          export V_BIN="$PWD/../v-pin/v.exe"
          export CC=gcc CXX=g++ AR=ar OBJDUMP=objdump DLLTOOL=dlltool
          JSC=$(echo /c/Users/runneradmin/AppData/Local/ms-playwright/webkit-*/JavaScriptCore.dll | tr ' ' '\n' | sort -r | head -n 1)
          sh tools/run_v_tool.sh build_windows_browser \
            --javascriptcore-dll "$(cygpath -m "$JSC")" \
            --output "$(cygpath -m "$PWD/Vox.exe")"

      - name: Stage runtime DLLs
        shell: msys2 {0}
        working-directory: vox
        run: |
          cp Build/deps/windows/mesa/release-mingw/x64/{libEGL.dll,libGLESv2.dll,libgallium_wgl.dll,opengl32.dll} ./
          cp /mingw64/bin/{libstdc++-6.dll,libgcc_s_seh-1.dll,libwinpthread-1.dll} ./

      - name: Smoke test
        shell: msys2 {0}
        working-directory: vox
        run: ./Vox.exe --headless-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: Vox-windows-x64
          path: |
            vox/Vox.exe
            vox/*.dll
